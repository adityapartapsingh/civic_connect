services:
  - type: web
    name: civic-connect-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn civic_connect.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: MONGODB_DB_NAME
        value: "civic_connect"
